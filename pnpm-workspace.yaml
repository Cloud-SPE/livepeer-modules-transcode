# TypeScript / Node packages in this monorepo.
# Packages land here as each component is ported per
# `docs/exec-plans/completed/0001-initial-port-roadmap.md`.
#
# Go modules (transcode-core / transcode-runner / abr-runner) are managed by
# `go.mod` per-component, not by pnpm. `codecs-builder` is Dockerfile-only.
packages:
  - "transcode-gateway"
  - "site"
  - "portal"
  - "admin"
  - "transcode-tester"
