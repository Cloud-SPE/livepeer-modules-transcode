services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: transcode
      POSTGRES_PASSWORD: transcode
      POSTGRES_DB: transcode
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcode"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: ..
      dockerfile: transcode-gateway/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://transcode:transcode@postgres:5432/transcode
      ADMIN_TOKEN: dev-admin-token-change-me
      API_KEY_HASH_PEPPER: dev-pepper-change-me
      SESSION_TTL_HOURS: "24"
      VERIFICATION_TOKEN_TTL_HOURS: "48"
      BASE_URL: http://localhost:4000
      PORTAL_URL: http://localhost:3002
      PORT: "4000"
      LOG_LEVEL: info
      ALLOWED_ORIGINS: "*"
      # RESEND_API_KEY unset — emails logged, not sent
    ports:
      - "4000:4000"

volumes:
  pgdata:
