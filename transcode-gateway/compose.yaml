services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: transcode
      POSTGRES_PASSWORD: transcode
      POSTGRES_DB: transcode
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcode"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: ..
      dockerfile: transcode-gateway/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://transcode:transcode@postgres:5432/transcode
      ADMIN_TOKEN: dev-admin-token-change-me
      API_KEY_HASH_PEPPER: dev-pepper-change-me
      SESSION_TTL_HOURS: "24"
      VERIFICATION_TOKEN_TTL_HOURS: "48"
      BASE_URL: http://localhost:4000
      PORTAL_URL: http://localhost:3002
      PORT: "4000"
      LOG_LEVEL: info
      ALLOWED_ORIGINS: "*"
      # RESEND_API_KEY unset — emails logged, not sent
      # Modules v2 requires a resolver socket, LOC URL/key, and an external
      # 32-byte wrapping key. Keep real secrets outside checked-in compose:
      # LIVEPEER_RESOLVER_SOCKET: /run/livepeer/resolver.sock
      # LIVEPEER_LOC_URL: http://loc:8080
      # LIVEPEER_LOC_API_KEY: supplied-by-secret-manager
      # LIVEPEER_CALLER_PRIVATE_KEY: supplied-by-secret-manager
      # LIVEPEER_OPERATION_SECRETS_KEK: supplied-by-secret-manager
      # RTMP relay opt-in. Uncomment to enable:
      # LIVEPEER_GATEWAY_EXTERNAL_RTMP_URL: rtmp://localhost:1935/live
      # RTMP_LISTEN_PORT: "1935"
    ports:
      - "4000:4000"
      - "1935:1935"

volumes:
  pgdata:
