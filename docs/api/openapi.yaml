openapi: 3.1.0
info:
  title: Livepeer Modules Transcode API
  version: 2.0.0
  description: Breaking paid-job/v1 and paid-session/v1 status surface.
paths:
  /api/v1/user/catalog:
    get:
      summary: List LOC advertised capabilities and network wholesale prices
      security: [{ UserSession: [] }]
      responses:
        "200":
          description: Current catalog; advertised prices are not reserved execution quotes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkCatalog" }
        "401": { description: Authentication required }
        "503": { description: LOC is unconfigured or unavailable }
  /api/v1/admin/catalog:
    get:
      summary: List LOC advertised capabilities and network wholesale prices
      security: [{ AdminToken: [] }]
      responses:
        "200":
          description: Current catalog; advertised prices are not reserved execution quotes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkCatalog" }
        "401": { description: Authentication required }
        "503": { description: LOC is unconfigured or unavailable }
  /api/v1/admin/waitlist/{id}/resend-verification:
    post:
      summary: Resend a pending unverified signup's verification email
      security: [{ AdminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Provider accepted the email, or email is in dry-run mode; acceptance does not guarantee inbox delivery
          content:
            application/json:
              schema:
                type: object
                required: [status, delivery]
                properties:
                  status: { type: string, const: ok }
                  delivery: { type: string, enum: [accepted, dryrun] }
        "400": { description: Invalid signup ID }
        "401": { description: Admin authentication required }
        "409": { description: Signup is not pending and unverified }
        "429": { description: One resend per signup per minute per gateway instance }
        "502": { description: Provider failed; previous verification token remains valid }
  /v1/videos/assets/{id}:
    get:
      summary: Get an API-key-owned VOD asset and its paid job status
      security: [{ ProductApiKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Asset detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetDetail" }
  /v1/live/streams:
    get:
      summary: List the latest 100 streams owned by this API key
      security: [{ ProductApiKey: [] }]
      responses:
        "200":
          description: Durable stream summaries; no ingest credentials
          content:
            application/json:
              schema:
                type: object
                required: [streams]
                properties:
                  streams: { type: array, items: { type: object } }
    post:
      summary: Create a live stream or return its durable recovery identity
      security: [{ ProductApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 160 }
                encoding_tier: { type: string, enum: [baseline, standard, premium], default: standard }
                offering: { type: string }
      responses:
        "201": { description: Ready; includes customer publishing credentials }
        "202":
          description: Durable setup pending; poll Location instead of creating a replacement
          headers:
            Location: { schema: { type: string } }
            Retry-After: { schema: { type: integer } }
        "502": { description: Setup failed before a recoverable paid operation was saved }
        "503": { description: Live service or discovery unavailable }
        "504": { description: Discovery timed out before a paid operation was created }
  /v1/live/streams/{id}/end:
    post:
      summary: Request durable session closure
      security: [{ ProductApiKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202": { description: Ending; poll detail until settlement completes }
        "200": { description: Already ended }
  /v1/live/streams/{id}:
    get:
      summary: Get an API-key-owned live stream and its paid session status
      security: [{ ProductApiKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Live stream detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveStreamDetail" }
  /api/v1/admin/operations:
    get:
      summary: List safe paid-operation diagnostics
      security: [{ AdminToken: [] }]
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [job, session] } }
        - { name: status, in: query, schema: { type: string, maxLength: 64 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        "200":
          description: Most recently updated operations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminPaidOperationStatus" }
components:
  securitySchemes:
    UserSession: { type: http, scheme: bearer }
    ProductApiKey: { type: http, scheme: bearer }
    AdminToken: { type: http, scheme: bearer }
  schemas:
    NetworkCatalog:
      type: object
      required: [source, price_basis, fetched_at, items]
      properties:
        source: { type: string, const: LOC }
        price_basis: { type: string, const: network_wholesale }
        fetched_at: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            required: [name, offerings]
            properties:
              name: { type: string }
              work_unit: { type: [string, "null"] }
              offerings:
                type: array
                items:
                  type: object
                  required: [id, protocol, price_per_work_unit_wei, units_per_price, configured_for_gateway]
                  properties:
                    id: { type: string }
                    protocol: { type: string }
                    work_unit: { type: [string, "null"] }
                    price_per_work_unit_wei:
                      type: [string, "null"]
                      description: Exact wei amount per units_per_price work units, not necessarily per one unit
                      pattern: '^\d+$'
                    units_per_price: { type: string, pattern: '^0*[1-9][0-9]*$' }
                    configured_for_gateway: { type: boolean }
                    job:
                      type: [object, "null"]
                      properties:
                        transports: { type: array, items: { type: string } }
                    session:
                      type: [object, "null"]
                      properties:
                        descriptor_schema: { type: string }
                        attachment: { type: string }
                        metering: { type: string }
    PaidOperationStatus:
      type: object
      required: [operation_id, protocol, state, request_id, work_unit, funded_units, warnings, recovered, retry_count, output_state, output_status, output_state_since, last_failure_code]
      properties:
        operation_id: { type: string }
        protocol: { type: string, enum: [paid-job/v1, paid-session/v1] }
        state: { type: string }
        request_id: { type: string }
        work_unit: { type: string }
        funded_units: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
        claimed_units: { type: [string, "null"], pattern: "^(0|[1-9][0-9]*)$" }
        balance_units: { type: [string, "null"], pattern: "^(0|[1-9][0-9]*)$" }
        lease_expires_at: { type: [string, "null"], format: date-time }
        warnings:
          type: array
          items: { type: string, enum: [refill_will_be_refused, funded_balance_exhausted, lease_expired, output_stalled] }
        recovered: { type: boolean }
        retry_count: { type: integer, minimum: 0 }
        next_retry_at: { type: [string, "null"], format: date-time }
        error_code: { type: [string, "null"] }
        relay_status: { type: [string, "null"] }
        delivered_units: { type: [string, "null"], pattern: "^(0|[1-9][0-9]*)$" }
        winddown_reason: { type: [string, "null"] }
        output_state: { type: [string, "null"], enum: [unknown, waiting, producing, stalled, null] }
        output_status: { type: [string, "null"], enum: [unknown, no_ingest, waiting, producing, stalled, output_failed, null] }
        output_state_since: { type: [string, "null"], format: date-time }
        last_failure_code: { type: [string, "null"], pattern: "^[a-z][a-z0-9_]{0,63}$" }
        terminal_at: { type: [string, "null"], format: date-time }
    AdminPaidOperationStatus:
      allOf:
        - { $ref: "#/components/schemas/PaidOperationStatus" }
        - type: object
          required: [kind, capability, offering, rotation_generation, settlement_sequence, created_at, updated_at]
          properties:
            kind: { type: string, enum: [job, session] }
            asset_id: { type: [string, "null"] }
            live_stream_id: { type: [string, "null"] }
            loc_operation_id: { type: [string, "null"] }
            broker_job_id: { type: [string, "null"] }
            broker_session_id: { type: [string, "null"] }
            capability: { type: string }
            offering: { type: string }
            transport: { type: [string, "null"], enum: [unary, stream, multipart, null] }
            quote_id: { type: string }
            quote_version: { type: string }
            route_fingerprint: { type: string }
            rotation_generation: { type: integer, minimum: 0 }
            settlement_sequence: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    AssetDetail:
      type: object
      required: [asset_id, api_key_id, status, paid_operation, renditions, jobs]
      properties:
        asset_id: { type: string }
        api_key_id: { type: string }
        status: { type: string }
        paid_operation:
          anyOf: [{ $ref: "#/components/schemas/PaidOperationStatus" }, { type: "null" }]
        renditions: { type: array, items: { type: object } }
        jobs: { type: array, items: { type: object } }
      additionalProperties: true
    LiveStreamDetail:
      type: object
      required: [stream_id, api_key_id, name, status, paid_operation, created_at]
      properties:
        stream_id: { type: string }
        api_key_id: { type: string }
        name: { type: string }
        status: { type: string, enum: [idle, opening, ready, live, ending, ended, failed] }
        rtmp_push_url: { type: [string, "null"], description: RTMP server URL; null until ready }
        stream_key: { type: [string, "null"], description: Customer publishing key for authenticated owner only; never a runner credential }
        rtmp_push_url_kind: { type: string, const: gateway_relay }
        paid_operation:
          anyOf: [{ $ref: "#/components/schemas/PaidOperationStatus" }, { type: "null" }]
        created_at: { type: string, format: date-time }
      additionalProperties: true
