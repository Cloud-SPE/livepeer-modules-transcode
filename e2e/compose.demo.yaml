# Opt-in external LOC/email integration. Secrets belong in .env.demo (ignored).
# Use with compose.yaml; the ordinary smoke stack remains self-contained.
services:
  gateway:
    env_file:
      - .env.demo
    environment:
      SITE_URL: http://localhost:3000
      BASE_URL: http://localhost:4000
      PORTAL_URL: http://localhost:3002
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002
    ports:
      - "1935:1935"
