services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: transcode
      POSTGRES_PASSWORD: transcode
      POSTGRES_DB: transcode
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcode"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-bucket-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin} &&
        mc mb --ignore-existing local/transcode &&
        mc anonymous set download local/transcode &&
        echo ok
      "
    restart: "no"

  mock-broker:
    build:
      context: ..
      dockerfile: transcode-gateway/Dockerfile
    command: ["node", "/app/transcode-gateway/mocks/mock-broker.mjs"]
    volumes:
      - ./mocks:/app/transcode-gateway/mocks:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 2s
      timeout: 2s
      retries: 30

  mock-resolver:
    build:
      context: ..
      dockerfile: transcode-gateway/Dockerfile
    command: ["node", "/app/transcode-gateway/mocks/mock-resolver.mjs"]
    environment:
      RESOLVER_SOCKET: /var/run/livepeer/resolver.sock
      BROKER_URL: http://mock-broker:8080
    volumes:
      - ./mocks:/app/transcode-gateway/mocks:ro
      - livepeer-sockets:/var/run/livepeer
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/run/livepeer/resolver.sock"]
      interval: 2s
      timeout: 2s
      retries: 30

  mock-payer-daemon:
    build:
      context: ..
      dockerfile: transcode-gateway/Dockerfile
    command: ["node", "/app/transcode-gateway/mocks/mock-payer-daemon.mjs"]
    environment:
      PAYER_SOCKET: /var/run/livepeer/payer.sock
    volumes:
      - ./mocks:/app/transcode-gateway/mocks:ro
      - livepeer-sockets:/var/run/livepeer
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/run/livepeer/payer.sock"]
      interval: 2s
      timeout: 2s
      retries: 30

  gateway:
    build:
      context: ..
      dockerfile: transcode-gateway/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-bucket-init:
        condition: service_completed_successfully
      mock-resolver:
        condition: service_healthy
      mock-payer-daemon:
        condition: service_healthy
      mock-broker:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://transcode:transcode@postgres:5432/transcode
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token-1234567890}
      API_KEY_HASH_PEPPER: ${API_KEY_HASH_PEPPER:-dev-pepper-1234567890}
      SESSION_TTL_HOURS: "24"
      VERIFICATION_TOKEN_TTL_HOURS: "48"
      BASE_URL: http://localhost:4000
      PORTAL_URL: http://localhost:3002
      PORT: "4000"
      LOG_LEVEL: info
      ALLOWED_ORIGINS: "*"
      S3_REGION: us-east-1
      S3_BUCKET: transcode
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      LIVEPEER_RESOLVER_SOCKET: /var/run/livepeer/resolver.sock
      LIVEPEER_PAYER_SOCKET: /var/run/livepeer/payer.sock
      LIVEPEER_FUNDED_VALUE_WEI: "1000000000000000"
    ports:
      - "4001:4000"
    volumes:
      - livepeer-sockets:/var/run/livepeer

volumes:
  livepeer-sockets: {}
