services:
  site:
    profiles: [ui]
    build:
      context: ..
      dockerfile: e2e/Dockerfile.ui
    environment:
      GATEWAY_URL: http://gateway:4000
    command: pnpm --dir site dev --host 0.0.0.0 --strictPort
    depends_on: [gateway]
    ports:
      - "127.0.0.1:3000:3000"

  admin:
    profiles: [ui]
    build:
      context: ..
      dockerfile: e2e/Dockerfile.ui
    environment:
      GATEWAY_URL: http://gateway:4000
    command: pnpm --dir admin dev --host 0.0.0.0 --strictPort
    depends_on: [gateway]
    ports:
      - "127.0.0.1:3001:3001"

  portal:
    profiles: [ui]
    build:
      context: ..
      dockerfile: e2e/Dockerfile.ui
    environment:
      GATEWAY_URL: http://gateway:4000
    command: pnpm --dir portal dev --host 0.0.0.0 --strictPort
    depends_on: [gateway]
    ports:
      - "127.0.0.1:3002:3002"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: transcode
      POSTGRES_PASSWORD: transcode
      POSTGRES_DB: transcode
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcode"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: create the bucket then exit.
  minio-bucket-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin} &&
        mc mb --ignore-existing local/transcode &&
        mc anonymous set download local/transcode &&
        echo ok
      "
    restart: "no"

  gateway:
    build:
      context: ..
      dockerfile: transcode-gateway/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-bucket-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://transcode:transcode@postgres:5432/transcode
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token-1234567890}
      API_KEY_HASH_PEPPER: ${API_KEY_HASH_PEPPER:-dev-pepper-1234567890}
      SESSION_TTL_HOURS: "24"
      VERIFICATION_TOKEN_TTL_HOURS: "48"
      SITE_URL: http://localhost:3000
      BASE_URL: http://localhost:4000
      PORTAL_URL: http://localhost:3002
      PORT: "4000"
      LOG_LEVEL: info
      ALLOWED_ORIGINS: "*"

      # S3 (MinIO) — wired
      S3_REGION: us-east-1
      S3_BUCKET: transcode
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"

      # LOC is unset in the default smoke; discovery remains unconfigured.
      # Use compose.demo.yaml for authenticated LOC HTTP discovery.

      # Gateway RTMP listener unwired in the e2e smoke (live route
      # returns 503 resolver_not_configured before even consulting it).
      # LIVEPEER_GATEWAY_EXTERNAL_RTMP_URL unset
    ports:
      - "4000:4000"
