name: livepeer-transcode-nvidia

x-runner: &runner
  platform: linux/amd64
  pull_policy: always
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"
  stop_grace_period: 45s

x-nvidia: &nvidia
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["${NVIDIA_GPU_ID}"]
            capabilities: [gpu]

services:
  gpu-admission-init:
    platform: linux/amd64
    image: ${LIVE_NVIDIA_IMAGE}
    pull_policy: always
    user: "0:0"
    read_only: true
    restart: "no"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        mkdir -p /var/lib/livepeer-gpu-admission
        touch "/var/lib/livepeer-gpu-admission/$${NVIDIA_GPU_ID}.mutex"
        touch "/var/lib/livepeer-gpu-admission/$${NVIDIA_GPU_ID}.batch"
        touch "/var/lib/livepeer-gpu-admission/$${NVIDIA_GPU_ID}.live"
        chmod 0666 "/var/lib/livepeer-gpu-admission/$${NVIDIA_GPU_ID}.mutex" "/var/lib/livepeer-gpu-admission/$${NVIDIA_GPU_ID}.batch" "/var/lib/livepeer-gpu-admission/$${NVIDIA_GPU_ID}.live"
    environment:
      NVIDIA_GPU_ID: ${NVIDIA_GPU_ID}
    volumes:
      - gpu-admission:/var/lib/livepeer-gpu-admission

  transcode-runner:
    <<: [*runner, *nvidia]
    image: tztcloud/transcode-runner-nvidia:v2.0.0@sha256:7f92ba9b6f9c04f77279cf2f0ddd7aad48ec1704c65e3ee87ed9898777e5e6bc
    environment:
      MAX_QUEUE_SIZE: ${VOD_MAX_QUEUE_SIZE:-1}
      GPU_ADMISSION_LOCK: /var/lib/livepeer-gpu-admission/${NVIDIA_GPU_ID}
      METRICS_ENABLED: "true"
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    ports:
      - "${VOD_BIND_IP:-0.0.0.0}:${VOD_PORT:-18080}:8080"
    volumes:
      - transcode-runner-state:/var/lib/transcode-runner
      - gpu-admission:/var/lib/livepeer-gpu-admission
    depends_on:
      gpu-admission-init:
        condition: service_completed_successfully
    networks: [runners]

  abr-runner:
    <<: [*runner, *nvidia]
    image: tztcloud/abr-runner-nvidia:v2.0.0@sha256:abbbab2e145f1910c68debd83a3bb60da0a8ff8d6b6d456b279bb06d6992386d
    environment:
      MAX_QUEUE_SIZE: ${ABR_MAX_QUEUE_SIZE:-1}
      GPU_ADMISSION_LOCK: /var/lib/livepeer-gpu-admission/${NVIDIA_GPU_ID}
      METRICS_ENABLED: "true"
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    ports:
      - "${ABR_BIND_IP:-0.0.0.0}:${ABR_PORT:-18180}:8080"
    volumes:
      - abr-runner-state:/var/lib/abr-runner
      - gpu-admission:/var/lib/livepeer-gpu-admission
    depends_on:
      gpu-admission-init:
        condition: service_completed_successfully
    networks: [runners]

  live-runner:
    <<: [*runner, *nvidia]
    image: ${LIVE_NVIDIA_IMAGE}
    environment:
      LIVE_RUNNER_MASTER_KEY: ${LIVE_RUNNER_MASTER_KEY}
      LIVE_RUNNER_BROKER_TOKEN: ${LIVE_RUNNER_BROKER_TOKEN}
      LIVE_RUNNER_INTERNAL_MEDIA_TOKEN: ${LIVE_RUNNER_INTERNAL_MEDIA_TOKEN}
      LIVE_RUNNER_MAX_CONCURRENT: "1"
      GPU_ADMISSION_LOCK: /var/lib/livepeer-gpu-admission/${NVIDIA_GPU_ID}
      LIVE_RUNNER_HARDWARE: nvidia
      LIVEPEER_PUBLIC_RTMP_URL: ${LIVEPEER_PUBLIC_RTMP_URL}
      LIVEPEER_PUBLIC_URL: ${LIVEPEER_PUBLIC_URL}
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    ports:
      - "${LIVE_HTTP_BIND_IP:-0.0.0.0}:${LIVE_HTTP_PORT:-18280}:8080"
      - "${LIVE_RTMP_BIND_IP:-0.0.0.0}:${LIVE_RTMP_PORT:-1935}:1935"
    volumes:
      - live-runner-state:/var/lib/live-runner
      - gpu-admission:/var/lib/livepeer-gpu-admission
    depends_on:
      gpu-admission-init:
        condition: service_completed_successfully
    networks: [runners]

networks:
  runners:
    driver: bridge

volumes:
  transcode-runner-state:
  abr-runner-state:
  live-runner-state:
  gpu-admission:
