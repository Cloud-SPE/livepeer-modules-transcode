name: livepeer-transcode-runners

x-paid-job-runner: &paid-job-runner
  platform: linux/amd64
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  environment:
    METRICS_ENABLED: ${METRICS_ENABLED:-true}

x-live-environment: &live-environment
  LIVE_RUNNER_MASTER_KEY: ${LIVE_RUNNER_MASTER_KEY:?set LIVE_RUNNER_MASTER_KEY to base64 for exactly 32 bytes}
  LIVE_RUNNER_BROKER_TOKEN: ${LIVE_RUNNER_BROKER_TOKEN:?set LIVE_RUNNER_BROKER_TOKEN to at least 32 characters}
  LIVE_RUNNER_INTERNAL_MEDIA_TOKEN: ${LIVE_RUNNER_INTERNAL_MEDIA_TOKEN:?set LIVE_RUNNER_INTERNAL_MEDIA_TOKEN to at least 32 characters}
  LIVE_RUNNER_MAX_CONCURRENT: ${LIVE_RUNNER_MAX_CONCURRENT:-1}

services:
  vod-nvidia:
    <<: *paid-job-runner
    profiles: [vod-nvidia]
    image: ${VOD_NVIDIA_IMAGE:-tztcloud/transcode-runner:v2-dev-runtime-nvidia}
    ports:
      - 127.0.0.1:${VOD_NVIDIA_PORT:-18080}:8080
    volumes:
      - vod-nvidia-state:/var/lib/transcode-runner
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${NVIDIA_GPU_ID:-0}"]
              capabilities: [gpu]

  vod-intel:
    <<: *paid-job-runner
    profiles: [vod-intel]
    image: ${VOD_INTEL_IMAGE:-tztcloud/transcode-runner:v2-dev-runtime-intel}
    ports:
      - 127.0.0.1:${VOD_INTEL_PORT:-18081}:8080
    volumes:
      - vod-intel-state:/var/lib/transcode-runner
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"

  vod-amd:
    <<: *paid-job-runner
    profiles: [vod-amd]
    image: ${VOD_AMD_IMAGE:-tztcloud/transcode-runner:v2-dev-runtime-amd}
    ports:
      - 127.0.0.1:${VOD_AMD_PORT:-18082}:8080
    volumes:
      - vod-amd-state:/var/lib/transcode-runner
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"

  # This profile becomes runnable when lmt-65a.3.10 ships runtime-cpu.
  vod-cpu:
    <<: *paid-job-runner
    profiles: [vod-cpu]
    image: ${VOD_CPU_IMAGE:-tztcloud/transcode-runner:v2-dev-runtime-cpu}
    ports:
      - 127.0.0.1:${VOD_CPU_PORT:-18083}:8080
    volumes:
      - vod-cpu-state:/var/lib/transcode-runner

  abr-nvidia:
    <<: *paid-job-runner
    profiles: [abr-nvidia]
    image: ${ABR_NVIDIA_IMAGE:-tztcloud/abr-runner:v2-dev-runtime-nvidia}
    ports:
      - 127.0.0.1:${ABR_NVIDIA_PORT:-18180}:8080
    volumes:
      - abr-nvidia-state:/var/lib/abr-runner
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${NVIDIA_GPU_ID:-0}"]
              capabilities: [gpu]

  abr-intel:
    <<: *paid-job-runner
    profiles: [abr-intel]
    image: ${ABR_INTEL_IMAGE:-tztcloud/abr-runner:v2-dev-runtime-intel}
    ports:
      - 127.0.0.1:${ABR_INTEL_PORT:-18181}:8080
    volumes:
      - abr-intel-state:/var/lib/abr-runner
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"

  abr-amd:
    <<: *paid-job-runner
    profiles: [abr-amd]
    image: ${ABR_AMD_IMAGE:-tztcloud/abr-runner:v2-dev-runtime-amd}
    ports:
      - 127.0.0.1:${ABR_AMD_PORT:-18182}:8080
    volumes:
      - abr-amd-state:/var/lib/abr-runner
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"

  live-nvidia:
    <<: *paid-job-runner
    profiles: [live-nvidia]
    image: ${LIVE_NVIDIA_IMAGE:-tztcloud/live-runner-nvidia:v2-dev}
    environment:
      <<: *live-environment
      LIVEPEER_PUBLIC_RTMP_URL: ${LIVE_NVIDIA_PUBLIC_RTMP_URL:-rtmp://127.0.0.1:1935}
      LIVEPEER_PUBLIC_URL: ${LIVE_NVIDIA_PUBLIC_URL:-http://127.0.0.1:18280}
    ports:
      - ${LIVE_NVIDIA_HTTP_BIND:-127.0.0.1}:${LIVE_NVIDIA_HTTP_PORT:-18280}:8080
      - ${LIVE_NVIDIA_RTMP_BIND:-0.0.0.0}:${LIVE_NVIDIA_RTMP_PORT:-1935}:1935
    volumes:
      - live-nvidia-state:/var/lib/live-runner
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${NVIDIA_GPU_ID:-0}"]
              capabilities: [gpu]

  live-intel:
    <<: *paid-job-runner
    profiles: [live-intel]
    image: ${LIVE_INTEL_IMAGE:-tztcloud/live-runner-intel:v2-dev}
    environment:
      <<: *live-environment
      LIVEPEER_PUBLIC_RTMP_URL: ${LIVE_INTEL_PUBLIC_RTMP_URL:-rtmp://127.0.0.1:1936}
      LIVEPEER_PUBLIC_URL: ${LIVE_INTEL_PUBLIC_URL:-http://127.0.0.1:18281}
    ports:
      - ${LIVE_INTEL_HTTP_BIND:-127.0.0.1}:${LIVE_INTEL_HTTP_PORT:-18281}:8080
      - ${LIVE_INTEL_RTMP_BIND:-0.0.0.0}:${LIVE_INTEL_RTMP_PORT:-1936}:1935
    volumes:
      - live-intel-state:/var/lib/live-runner
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"

  live-amd:
    <<: *paid-job-runner
    profiles: [live-amd]
    image: ${LIVE_AMD_IMAGE:-tztcloud/live-runner-amd:v2-dev}
    environment:
      <<: *live-environment
      LIVEPEER_PUBLIC_RTMP_URL: ${LIVE_AMD_PUBLIC_RTMP_URL:-rtmp://127.0.0.1:1937}
      LIVEPEER_PUBLIC_URL: ${LIVE_AMD_PUBLIC_URL:-http://127.0.0.1:18282}
    ports:
      - ${LIVE_AMD_HTTP_BIND:-127.0.0.1}:${LIVE_AMD_HTTP_PORT:-18282}:8080
      - ${LIVE_AMD_RTMP_BIND:-0.0.0.0}:${LIVE_AMD_RTMP_PORT:-1937}:1935
    volumes:
      - live-amd-state:/var/lib/live-runner
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"

  live-cpu:
    <<: *paid-job-runner
    profiles: [live-cpu]
    image: ${LIVE_CPU_IMAGE:-tztcloud/live-runner-cpu:v2-dev}
    environment:
      <<: *live-environment
      LIVEPEER_PUBLIC_RTMP_URL: ${LIVE_CPU_PUBLIC_RTMP_URL:-rtmp://127.0.0.1:1938}
      LIVEPEER_PUBLIC_URL: ${LIVE_CPU_PUBLIC_URL:-http://127.0.0.1:18283}
    ports:
      - ${LIVE_CPU_HTTP_BIND:-127.0.0.1}:${LIVE_CPU_HTTP_PORT:-18283}:8080
      - ${LIVE_CPU_RTMP_BIND:-0.0.0.0}:${LIVE_CPU_RTMP_PORT:-1938}:1935
    volumes:
      - live-cpu-state:/var/lib/live-runner

volumes:
  vod-nvidia-state:
  vod-intel-state:
  vod-amd-state:
  vod-cpu-state:
  abr-nvidia-state:
  abr-intel-state:
  abr-amd-state:
  live-nvidia-state:
  live-intel-state:
  live-amd-state:
  live-cpu-state:
